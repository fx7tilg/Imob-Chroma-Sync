project_id = "chroma-sync"
 
[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
 
[db]
port = 54322
shadow_port = 54320
major_version = 15
 
[studio]
enabled = true
port = 54323
 
[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true
 
[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false
 
[realtime]
enabled = true
 
[storage]
enabled = true
file_size_limit = "50MiB"
 
# Vector/analytics fails to parse the Podman socket path on Windows; disable it.
[analytics]
enabled = false