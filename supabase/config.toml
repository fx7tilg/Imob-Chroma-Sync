project_id = "chroma-sync"
 
[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
 
[db]
port = 54322
shadow_port = 54320
major_version = 15
 
[studio]
enabled = true
port = 54323
 
[auth]
enabled = true
# NOTE: this file configures the LOCAL stack (`supabase start`). The hosted
# project is configured in the Supabase dashboard - the values below are NOT
# applied there. Production requirements (see README "Production deployment"):
#   * site_url            -> the real frontend origin (reset/magic-link emails
#                            are built from it; localhost makes them unusable)
#   * enable_confirmations -> true (otherwise anyone can register an account
#                            against an email address they do not control)
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true
 
[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false
 
# Edge Functions: verify_jwt is the platform-level gate. on-decision-submitted
# and detect-conflicts are invoked by pg_net with the service-role key and
# additionally check it themselves; dima-lookup / vred-preview resolve the
# caller via GoTrue. pki-auth stays off unless ENABLE_PKI_DEMO_AUTH=true.
[functions.on-decision-submitted]
verify_jwt = true

[functions.detect-conflicts]
verify_jwt = true

[functions.dima-lookup]
verify_jwt = true

[functions.vred-preview]
verify_jwt = true

[functions.pki-auth]
verify_jwt = false

[realtime]
enabled = true
 
[storage]
enabled = true
file_size_limit = "50MiB"
 
# Vector/analytics fails to parse the Podman socket path on Windows; disable it.
[analytics]
enabled = false